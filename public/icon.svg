<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!--
    Fills are presentation ATTRIBUTES, not CSS, so a rasterizer that ignores
    the <style> block (Google's favicon crawler, librsvg, most icon tooling)
    still gets a black tile with a white mark. The previous version set the
    colours only inside prefers-color-scheme blocks over a root fill="none",
    so anything that skipped the media queries rendered a fully transparent
    square — which is why search results showed a generic globe.
    CSS beats presentation attributes, so the dark-scheme rule below still
    inverts the icon in browsers that do support it.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .background { fill: #ffffff; }
      .foreground { fill: #000000; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="37" fill="#000000" />
  <!-- Scale about the centre. The previous `style="transform: scale(95%)"`
       is CSS-only syntax that SVG rasterizers drop. -->
  <g transform="translate(4.5,4.5) scale(0.95)">
    <path class="foreground" fill="#ffffff"
      d="M101.141 53H136.632C151.023 53 162.689 64.6662 162.689 79.0573V112.904H148.112V79.0573C148.112 78.7105 148.098 78.3662 148.072 78.0251L112.581 112.898C112.701 112.902 112.821 112.904 112.941 112.904H148.112V126.672H112.941C98.5504 126.672 86.5638 114.891 86.5638 100.5V66.7434H101.141V100.5C101.141 101.15 101.191 101.792 101.289 102.422L137.56 66.7816C137.255 66.7563 136.945 66.7434 136.632 66.7434H101.141V53Z" />
    <path class="foreground" fill="#ffffff"
      d="M65.2926 124.136L14 66.7372H34.6355L64.7495 100.436V66.7372H80.1365V118.47C80.1365 126.278 70.4953 129.958 65.2926 124.136Z" />
  </g>
</svg>
